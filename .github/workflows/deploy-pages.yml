name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Environment-scoped variables/secrets are only available to jobs that
    # explicitly select the environment.
    environment:
      name: github-pages
    env:
      # Prefer an environment/repository variable, then an environment secret.
      # The value is embedded into the public bundle, so a variable is preferred
      # for non-sensitive API URLs.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '/api/v1' }}
      # The repository is nvnghia86.github.io, so Pages serves it at the domain root.
      VITE_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify production build path
        run: test -n "$VITE_BASE_PATH"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
