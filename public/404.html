<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hi Space</title>
    <script type="text/javascript">
      // SPA redirect script for GitHub Pages User Sites (https://<username>.github.io/)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (pathSegmentsToKeep > 0 ? '/' + l.pathname.split('/').slice(1, 1 + pathSegmentsToKeep).join('/') : '') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
