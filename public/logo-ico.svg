<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Circular Badge -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="2.5" />
  
  <!-- Mountain Silhouette -->
  <path d="M 52 82 L 74 58 L 96 82 Z" fill="#ffffff" fill-opacity="0.9" filter="url(#glow)" />
  <path d="M 68 82 L 80 68 L 92 82 Z" fill="#93c5fd" fill-opacity="0.5" />

  <!-- Keyboard Key J -->
  <rect x="22" y="32" width="16" height="16" rx="4" fill="#ffffff" filter="url(#glow)" />
  <text x="30" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#1e40af" text-anchor="middle" dominant-baseline="middle">J</text>

  <!-- Keyboard Key F -->
  <rect x="34" y="46" width="16" height="16" rx="4" fill="#ffffff" filter="url(#glow)" />
  <text x="42" y="58" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#1e40af" text-anchor="middle" dominant-baseline="middle">F</text>

  <!-- Keyboard Key P (or Space bar / Bottom key) -->
  <rect x="22" y="60" width="16" height="16" rx="4" fill="#ffffff" filter="url(#glow)" />
  <text x="30" y="72" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#1e40af" text-anchor="middle" dominant-baseline="middle">P</text>

  <!-- Key Connector / Pathway -->
  <rect x="34" y="60" width="16" height="16" rx="4" fill="#ffffff" fill-opacity="0.8" filter="url(#glow)" />

  <!-- Dynamic Curved Speed Arrow -->
  <path d="M 40 48 C 44 34, 58 28, 76 34 L 74 29 L 88 36 L 77 47 L 76 41 C 62 36, 48 42, 44 54 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Sparkles / Star -->
  <path d="M 85 24 L 87 29 L 92 31 L 87 33 L 85 38 L 83 33 L 78 31 L 83 29 Z" fill="#fef08a" />
  <path d="M 94 44 L 95 47 L 98 48 L 95 49 L 94 52 L 93 49 L 90 48 L 93 47 Z" fill="#ffffff" />
</svg>
